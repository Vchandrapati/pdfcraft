# sccache, if you use it, belongs in your user-level ~/.cargo/config.toml (`[build] rustc-wrapper =
# "sccache"`), so machines without it (CI) still build.

[alias]
xtask = "run -p xtask --"

# rust-lld ships with the Rust toolchain and links much faster than MSVC's link.exe, which
# dominated build time here (87 test executables, each linking the whole app).
[target.x86_64-pc-windows-msvc]
linker = "rust-lld.exe"
